<script>

const API_URL = "https://rut200-backend-1.onrender.com/api/live";

const ctx = document.getElementById('ampChart');

const ampData = [];

const ampChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            label: 'Amp Trend',
            data: ampData,
            borderColor: '#22c55e',
            borderWidth: 2,
            tension: 0.3
        }]
    },
    options: {
        responsive:true,
        maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{
            y:{ min:0, max:5, ticks:{ color:'white' }, grid:{ color:'#334155' } },
            x:{ ticks:{ display:false }, grid:{ display:false } }
        }
    }
});

function safe(val){
    return isNaN(val) ? 0 : val;
}

function setVoltageColor(id,value){
    const el = document.getElementById(id);
    if(value >= 220 && value <= 240) el.className="value green";
    else if(value >= 210) el.className="value yellow";
    else el.className="value red";
}

function setAmpColor(id,value){
    const el = document.getElementById(id);
    if(value <= 3) el.className="value green";
    else if(value <= 4) el.className="value yellow";
    else el.className="value red";
}

function setPhaseStatus(id,value){
    const el = document.getElementById(id);
    if(value >= 220) el.className="phase-dot green-dot";
    else if(value >= 210) el.className="phase-dot yellow-dot";
    else el.className="phase-dot red-dot";
}

async function loadData(){

    try{

        const response = await fetch(API_URL);
        const json = await response.json();

        console.log("LIVE DATA:", json); // DEBUG IMPORTANT

        const v1 = safe(parseFloat(json.Average_VN));
        const v2 = safe(parseFloat(json.R_N));
        const v3 = safe(parseFloat(json.Y_N));
        const v4 = safe(parseFloat(json.B_N));
        const amp = safe(parseFloat(json.Average_Amp));

        document.getElementById("v1").innerText = v1.toFixed(1);
        document.getElementById("v2").innerText = v2.toFixed(1);
        document.getElementById("v3").innerText = v3.toFixed(1);
        document.getElementById("v4").innerText = v4.toFixed(1);
        document.getElementById("v5").innerText = amp.toFixed(1);

        setVoltageColor("v1",v1);
        setVoltageColor("v2",v2);
        setVoltageColor("v3",v3);
        setVoltageColor("v4",v4);

        setPhaseStatus("r-dot",v2);
        setPhaseStatus("y-dot",v3);
        setPhaseStatus("b-dot",v4);

        setAmpColor("v5",amp);

        document.getElementById("system-status").innerText = json.status || "OFFLINE";
        document.getElementById("update-time").innerText = json.last_update || "--";

        // chart update
        ampChart.data.labels.push('');
        ampChart.data.datasets[0].data.push(amp);

        if(ampChart.data.labels.length > 20){
            ampChart.data.labels.shift();
            ampChart.data.datasets[0].data.shift();
        }

        ampChart.update('none');

    }
    catch(error){
        console.log("ERROR:", error);
        document.getElementById("system-status").innerText = "OFFLINE";
    }
}

setInterval(loadData, 1000);
loadData();

</script>
