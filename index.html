<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSIPL SMALL BANDING m/c</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        .phase-bar{

    display:flex;
    gap:20px;
    margin-bottom:25px;
    flex-wrap:wrap;

}

.phase{

    background:#1e293b;
    padding:12px 20px;
    border-radius:12px;
    border:1px solid #334155;
    font-weight:bold;

}

.phase-dot{

    width:14px;
    height:14px;
    border-radius:50%;
    display:inline-block;
    margin-left:10px;

}

.green-dot{

    background:#22c55e;
    box-shadow:0 0 10px #22c55e;

}

.yellow-dot{

    background:#facc15;
    box-shadow:0 0 10px #facc15;

}

.red-dot{

    background:#ef4444;
    box-shadow:0 0 10px #ef4444;

}

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family: Arial, sans-serif;
            background:#0f172a;
            color:white;
            padding:20px;

        }

        .header{

            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
            flex-wrap:wrap;

        }

        .title{

            font-size:32px;
            font-weight:bold;
            color:#38bdf8;

        }

        .status-box{

            background:#1e293b;
            padding:15px 25px;
            border-radius:15px;
            border:1px solid #334155;

        }

        .status-online{

            color:#22c55e;
            font-weight:bold;

        }

        .main-grid{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;

        }

        .card{

            background:#1e293b;
            border-radius:20px;
            padding:30px;
            border:1px solid #334155;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
            transition:0.3s;

        }

        .card:hover{

            transform:translateY(-5px);

        }

        .card-title{

            font-size:18px;
            color:#94a3b8;
            margin-bottom:20px;

        }

        .value{

            font-size:48px;
            font-weight:bold;
            transition:0.3s;

        }

        .green{

            color:#22c55e;
            text-shadow:0 0 15px #22c55e;

        }

        .yellow{

            color:#facc15;
            text-shadow:0 0 15px #facc15;

        }

        .red{

            color:#ef4444;
            text-shadow:0 0 15px #ef4444;

        }

        .unit{

            font-size:22px;
            color:#cbd5e1;
            margin-left:8px;

        }

        .footer{

            margin-top:40px;
            text-align:center;
            color:#94a3b8;
            font-size:16px;

        }

        .live-dot{

            width:12px;
            height:12px;
            background:#22c55e;
            border-radius:50%;
            display:inline-block;
            margin-right:8px;
            animation:blink 1s infinite;

        }

        .trend-box{

            margin-top:20px;
            height:120px;

        }

        @keyframes blink{

            0%{opacity:1;}
            50%{opacity:0.3;}
            100%{opacity:1;}

        }

        @media(max-width:768px){

            .title{
                font-size:24px;
            }

            .value{
                font-size:36px;
            }

        }

    </style>

</head>

<body>

    <div class="header">

        <div class="phase-bar">

    <div class="phase phase-r">
        R PHASE
        <span id="r-dot" class="phase-dot green-dot"></span>
    </div>

    <div class="phase phase-y">
        Y PHASE
        <span id="y-dot" class="phase-dot green-dot"></span>
    </div>

    <div class="phase phase-b">
        B PHASE
        <span id="b-dot" class="phase-dot green-dot"></span>
    </div>

</div>

        <div class="title">
            RUT200 POWER MONITORING
        </div>

        <div class="status-box">

            <span class="live-dot"></span>

            <span id="system-status" class="status-online">
                ONLINE
            </span>

            <br><br>

            Last Update:
            <span id="update-time">
                --:--:--
            </span>

        </div>

    </div>

    <div class="main-grid">

        <div class="card">

            <div class="card-title">
                Average VN
            </div>

            <div>
                <span class="value" id="v1">0</span>
                <span class="unit">V</span>
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                R-N Voltage
            </div>

            <div>
                <span class="value" id="v2">0</span>
                <span class="unit">V</span>
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Y-N Voltage
            </div>

            <div>
                <span class="value" id="v3">0</span>
                <span class="unit">V</span>
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                B-N Voltage
            </div>

            <div>
                <span class="value" id="v4">0</span>
                <span class="unit">V</span>
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Average Current
            </div>

            <div>
                <span class="value" id="v5">0</span>
                <span class="unit">A</span>
            </div>

            <div class="trend-box">
                <canvas id="ampChart"></canvas>
            </div>

        </div>

    </div>

    <div class="footer">

        Industrial IoT SCADA Dashboard

    </div>

<script>

const ctx = document.getElementById('ampChart');

const ampData = [];

const ampChart = new Chart(ctx, {

    type: 'line',

    data: {

        labels: [],

        datasets: [{

            label: 'Amp Trend',

            data: ampData,

            borderColor: '#22c55e',

            borderWidth: 2,

            tension: 0.3

        }]

    },

    options: {

        responsive:true,

        maintainAspectRatio:false,

        plugins:{
            legend:{
                display:false
            }
        },

        scales:{

            y:{
                min:0,
                max:5,
                ticks:{
                    color:'white'
                },
                grid:{
                    color:'#334155'
                }
            },

            x:{
                ticks:{
                    display:false
                },
                grid:{
                    display:false
                }
            }

        }

    }

});

function setVoltageColor(id,value){

    const el = document.getElementById(id);

    if(value >= 220 && value <= 240){

        el.className = "value green";

    }

    else if(value >= 210 && value < 220){

        el.className = "value yellow";

    }

    else{

        el.className = "value red";

    }

}

function setAmpColor(id,value){

    const el = document.getElementById(id);

    if(value <= 3){

        el.className = "value green";

    }

    else if(value > 3 && value <= 4){

        el.className = "value yellow";

    }

    else{

        el.className = "value red";

    }

}

function setPhaseStatus(id,value){

    const el = document.getElementById(id);

    if(value >= 220){

        el.className = "phase-dot green-dot";

    }

    else if(value >= 210){

        el.className = "phase-dot yellow-dot";

    }

    else{

        el.className = "phase-dot red-dot";

    }

}

async function loadData(){

    try{

        const response =
        const response = await fetch("https://rut200-backend.onrender.com/api/live");

        const json = await response.json();

        const v1 = parseFloat(json.Average_VN);

        const v2 = parseFloat(json.R_N);

        const v3 = parseFloat(json.Y_N);

        const v4 = parseFloat(json.B_N);

        const amp = parseFloat(json.Average_Amp);

        document.getElementById("v1").innerText =
        v1.toFixed(1);

        document.getElementById("v2").innerText =
        v2.toFixed(1);

        document.getElementById("v3").innerText =
        v3.toFixed(1);

        document.getElementById("v4").innerText =
        v4.toFixed(1);

        document.getElementById("v5").innerText =
        amp.toFixed(1);

        setVoltageColor("v1",v1);
        setVoltageColor("v2",v2);
        setVoltageColor("v3",v3);
        setVoltageColor("v4",v4);
        setPhaseStatus("r-dot",v2);
        setPhaseStatus("y-dot",v3);
        setPhaseStatus("b-dot",v4);

        setAmpColor("v5",amp);

        document.getElementById("system-status").innerText =
        json.status;

        document.getElementById("update-time").innerText =
        json.last_update;

       if(!isNaN(amp)){

    ampChart.data.labels.push('');

    ampChart.data.datasets[0].data.push(amp);

    if(ampChart.data.labels.length > 20){

        ampChart.data.labels.shift();

        ampChart.data.datasets[0].data.shift();

    }

    ampChart.update('none');

}

    }

    catch(error){

        document.getElementById("system-status").innerText =
        "OFFLINE";

        console.log(error);

    }

}

setInterval(loadData,1000);

loadData();

</script>

</body>
</html>
