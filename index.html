<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUT200 POWER MONITORING</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.title{
    font-size:28px;
    font-weight:bold;
    color:#38bdf8;
}

.status-box{
    background:#1e293b;
    padding:10px 15px;
    border-radius:10px;
}

.main-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.value{
    font-size:40px;
    font-weight:bold;
}

.green{color:#22c55e;}
.yellow{color:#facc15;}
.red{color:#ef4444;}

.phase-bar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.phase-dot{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
}

.green-dot{background:#22c55e;}
.yellow-dot{background:#facc15;}
.red-dot{background:#ef4444;}

</style>

</head>

<body>

<div class="header">

    <div class="title">SSIPL SMALL BANDING MACHINE</div>

    <div class="status-box">
        Status: <span id="system-status">--</span><br>
        <small id="update-time">--</small>
    </div>

</div>

<div class="phase-bar">
    <div>R <span id="r-dot" class="phase-dot green-dot"></span></div>
    <div>Y <span id="y-dot" class="phase-dot green-dot"></span></div>
    <div>B <span id="b-dot" class="phase-dot green-dot"></span></div>
</div>

<div class="main-grid">

    <div class="card">
        <div>Average VN</div>
        <div class="value" id="v1">0</div>
    </div>

    <div class="card">
        <div>R-N</div>
        <div class="value" id="v2">0</div>
    </div>

    <div class="card">
        <div>Y-N</div>
        <div class="value" id="v3">0</div>
    </div>

    <div class="card">
        <div>B-N</div>
        <div class="value" id="v4">0</div>
    </div>

    <div class="card">
        <div>Current (A)</div>
        <div class="value" id="v5">0</div>
        <canvas id="ampChart"></canvas>
    </div>

</div>

<script>

const API_URL = "https://rut200-backend-1.onrender.com/api/live";

const ctx = document.getElementById('ampChart');

const ampChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            data: [],
            borderColor: '#22c55e',
            borderWidth: 2,
            tension: 0.3
        }]
    },
    options: {
        responsive:true,
        plugins:{legend:{display:false}},
        scales:{
            y:{min:0,max:5,ticks:{color:'white'}},
            x:{display:false}
        }
    }
});

function setColor(id,val){
    let el=document.getElementById(id);
    if(val>=220) el.className="value green";
    else if(val>=210) el.className="value yellow";
    else el.className="value red";
}

function setPhase(id,val){
    let el=document.getElementById(id);
    if(val>=220) el.className="phase-dot green-dot";
    else if(val>=210) el.className="phase-dot yellow-dot";
    else el.className="phase-dot red-dot";
}

async function loadData(){

    try{

        const res = await fetch(API_URL);
        const data = await res.json();

        console.log(data);

        let v1 = Number(data.Average_VN);
        let v2 = Number(data.R_N);
        let v3 = Number(data.Y_N);
        let v4 = Number(data.B_N);
        let amp = Number(data.Average_Amp);

        document.getElementById("v1").innerText = v1.toFixed(1);
        document.getElementById("v2").innerText = v2.toFixed(1);
        document.getElementById("v3").innerText = v3.toFixed(1);
        document.getElementById("v4").innerText = v4.toFixed(1);
        document.getElementById("v5").innerText = amp.toFixed(2);

        setColor("v1",v1);
        setColor("v2",v2);
        setColor("v3",v3);
        setColor("v4",v4);

        setPhase("r-dot",v2);
        setPhase("y-dot",v3);
        setPhase("b-dot",v4);

        document.getElementById("system-status").innerText = data.status;
        document.getElementById("update-time").innerText = data.last_update;

        // chart update
        ampChart.data.labels.push("");
        ampChart.data.datasets[0].data.push(amp);

        if(ampChart.data.labels.length > 20){
            ampChart.data.labels.shift();
            ampChart.data.datasets[0].data.shift();
        }

        ampChart.update();

    }
    catch(err){
        console.log("ERROR:",err);
        document.getElementById("system-status").innerText="OFFLINE";
    }
}

setInterval(loadData,2000);
loadData();

</script>

</body>
</html>
